services:
  web:
    build: .
    image: pharma-category-dashboard:latest
    container_name: pharma-category-dashboard
    restart: unless-stopped
    ports:
      - "8060:8060"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-this-secret-in-production}"
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_TIME_ZONE: "Asia/Baghdad"
      SEED_DEMO: "1"
      # الحساب الأول: الخدمتان معاً (متابعة التصنيفات + مطابقة المذكرات)
      APP_OWNER_USERNAME: "${APP_OWNER_USERNAME:-admin}"
      APP_OWNER_PASSWORD: "${APP_OWNER_PASSWORD:-}"
      # الحساب الثاني: متابعة التصنيفات فقط
      APP_SECOND_USERNAME: "${APP_SECOND_USERNAME:-user2}"
      APP_SECOND_PASSWORD: "${APP_SECOND_PASSWORD:-}"
    volumes:
      - pharma_data:/app/data

volumes:
  pharma_data:
