# Render Blueprint: one Docker web service. The database lives on Neon
# (paste its connection string as DATABASE_URL when Render asks), because
# Render's own disk is wiped on every deploy and restart.
services:
  - type: web
    name: pharma-dashboard
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_TIME_ZONE
        value: Asia/Baghdad
      - key: SEED_DEMO
        value: "1"
      # The free instance has 512 MB of RAM: one process with a few
      # threads leaves room for openpyxl to read a large workbook.
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "300"
      - key: APP_OWNER_USERNAME
        value: admin
      - key: APP_OWNER_PASSWORD
        sync: false
      - key: APP_SECOND_USERNAME
        value: user2
      - key: APP_SECOND_PASSWORD
        sync: false
